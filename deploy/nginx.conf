# Future Solutions — nginx config (Next.js static export from /out)
# Apply: copy to /etc/nginx/sites-available/futuresolutionsdev.com
#        ln -s into sites-enabled, then: nginx -t && systemctl reload nginx
#
# This file is intentionally OUTSIDE public/ so it is never published to the website.

# ── HTTP → HTTPS ─────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name futuresolutionsdev.com www.futuresolutionsdev.com;
    return 301 https://futuresolutionsdev.com$request_uri;
}

# ── www → non-www (canonical host) ──────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.futuresolutionsdev.com;

    ssl_certificate /etc/letsencrypt/live/futuresolutionsdev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/futuresolutionsdev.com/privkey.pem;

    return 301 https://futuresolutionsdev.com$request_uri;
}

# ── Main site ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name futuresolutionsdev.com;

    ssl_certificate /etc/letsencrypt/live/futuresolutionsdev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/futuresolutionsdev.com/privkey.pem;

    root /var/www/futuresolutions/out;
    index index.html;

    # Compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # Security headers (note: nginx add_header is NOT inherited into locations
    # that declare their own add_header — so they are repeated where needed)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /404.html;

    # Never serve dotfiles
    location ~ /\. {
        deny all;
    }

    # Project gallery folders — JSON directory listing, so screenshots uploaded
    # straight into out/Projects/<Name>/ appear on the site WITHOUT a rebuild
    # (the client fetches this listing at runtime; see src/lib/useProjectImages.ts)
    location ~ ^/Projects/[^/]+/$ {
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-cache" always;
    }

    # Root → default language
    location = / {
        return 302 /en;
    }

    # Legacy URLs (pre-i18n) → English versions, permanent
    location ~ ^/(about|services|solutions|portfolio|technologies|contact|blog)(/.*)?$ {
        return 301 /en/$1$2;
    }

    # Hashed build assets — content-addressed, cache forever
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Images, icons and fonts — one month
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif|woff|woff2)$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Everything else (HTML pages, sitemap, manifest) — always revalidate,
    # so new deploys are visible immediately. Extensionless URLs resolve
    # to their exported .html file; anything unknown is a real 404.
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
