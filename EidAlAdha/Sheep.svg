<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" fill="none">
  <defs>
    <radialGradient id="woolWhite" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#FAFAFA"/>
      <stop offset="100%" stop-color="#E0E0E0"/>
    </radialGradient>
    <linearGradient id="sheepFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8D6E63"/>
      <stop offset="100%" stop-color="#6D4C41"/>
    </linearGradient>
    <filter id="woolShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#795548" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Flip horizontally -->
  <g transform="translate(120,0) scale(-1,1)">

    <!-- Legs -->
    <rect x="32" y="70" width="6" height="20" rx="3" fill="#795548"/>
    <rect x="45" y="72" width="6" height="18" rx="3" fill="#795548"/>
    <rect x="68" y="72" width="6" height="18" rx="3" fill="#6D4C41"/>
    <rect x="80" y="70" width="6" height="20" rx="3" fill="#6D4C41"/>

    <!-- Hooves -->
    <rect x="31" y="87" width="8" height="4" rx="2" fill="#3E2723"/>
    <rect x="44" y="87" width="8" height="4" rx="2" fill="#3E2723"/>
    <rect x="67" y="87" width="8" height="4" rx="2" fill="#3E2723"/>
    <rect x="79" y="87" width="8" height="4" rx="2" fill="#3E2723"/>

    <!-- Body -->
    <g filter="url(#woolShadow)">
      <circle cx="60" cy="55" r="22" fill="url(#woolWhite)"/>
      <circle cx="42" cy="52" r="16" fill="url(#woolWhite)"/>
      <circle cx="78" cy="52" r="16" fill="url(#woolWhite)"/>
      <circle cx="50" cy="42" r="14" fill="url(#woolWhite)"/>
      <circle cx="70" cy="42" r="14" fill="url(#woolWhite)"/>
      <circle cx="60" cy="38" r="12" fill="url(#woolWhite)"/>
      <circle cx="45" cy="60" r="12" fill="url(#woolWhite)"/>
      <circle cx="75" cy="60" r="12" fill="url(#woolWhite)"/>
      <circle cx="55" cy="35" r="10" fill="#F5F5F5"/>
      <circle cx="65" cy="35" r="10" fill="#F5F5F5"/>
    </g>

    <!-- Tail -->
    <circle cx="90" cy="48" r="8" fill="url(#woolWhite)"/>
    <circle cx="95" cy="45" r="6" fill="#F5F5F5"/>

    <!-- Head -->
    <ellipse cx="25" cy="45" rx="14" ry="12" fill="url(#sheepFace)"/>

    <!-- Ears -->
    <ellipse cx="14" cy="38" rx="6" ry="4" fill="#A1887F" transform="rotate(-20 14 38)"/>
    <ellipse cx="14" cy="38" rx="4" ry="2.5" fill="#BCAAA4" transform="rotate(-20 14 38)"/>
    <ellipse cx="36" cy="36" rx="6" ry="4" fill="#A1887F" transform="rotate(20 36 36)"/>
    <ellipse cx="36" cy="36" rx="4" ry="2.5" fill="#BCAAA4" transform="rotate(20 36 36)"/>

    <!-- Eyes -->
    <circle cx="20" cy="42" r="3" fill="white"/>
    <circle cx="30" cy="42" r="3" fill="white"/>
    <circle cx="20" cy="42" r="1.8" fill="#212121"/>
    <circle cx="30" cy="42" r="1.8" fill="#212121"/>
    <circle cx="20.8" cy="41.2" r="0.6" fill="white"/>
    <circle cx="30.8" cy="41.2" r="0.6" fill="white"/>

    <!-- Nose -->
    <ellipse cx="25" cy="50" rx="4" ry="2.5" fill="#5D4037"/>
    <circle cx="23" cy="50" r="1" fill="#3E2723"/>
    <circle cx="27" cy="50" r="1" fill="#3E2723"/>

    <!-- Smile -->
    <path d="M22 53 Q25 56 28 53" stroke="#5D4037" stroke-width="1" fill="none" stroke-linecap="round"/>

    <!-- Head wool -->
    <circle cx="22" cy="34" r="5" fill="url(#woolWhite)"/>
    <circle cx="28" cy="33" r="5" fill="url(#woolWhite)"/>
    <circle cx="25" cy="32" r="4" fill="#F5F5F5"/>

    <!-- Ribbon -->
    <path d="M15 48 Q25 52 35 48" stroke="#E91E63" stroke-width="2" fill="none"/>

    <!-- Bell -->
    <circle cx="25" cy="55" r="3" fill="#FFD700" stroke="#DAA520" stroke-width="0.5"/>
    <line x1="25" y1="55" x2="25" y2="57" stroke="#DAA520" stroke-width="0.8"/>
    <circle cx="25" cy="57.5" r="0.8" fill="#DAA520"/>

  </g>
</svg>