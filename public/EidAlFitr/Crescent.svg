<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="crescentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <filter id="crescentGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="starGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </radialGradient>
  </defs>
  <!-- Crescent -->
  <g filter="url(#crescentGlow)">
    <path d="M50 10 A30 30 0 1 0 50 70 A22 22 0 1 1 50 10" fill="url(#crescentGold)"/>
  </g>
  <!-- Star -->
  <g transform="translate(55, 30)" filter="url(#crescentGlow)">
    <path d="M8 0 L10 6 L16 6 L11 10 L13 16 L8 12 L3 16 L5 10 L0 6 L6 6 Z" fill="url(#starGlow)"/>
  </g>
</svg>