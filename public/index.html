<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Future Solutions Dev</title>
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://futuresolutionsdev.com/en">
    <script>
        // Fallback root redirect (nginx already 302s "/" to /en).
        // Rule: a previously chosen language wins; otherwise the default is en.
        // GUARD: only ever redirect from the actual root — if a server config
        // serves this file under any other path (e.g. /ar/), do nothing,
        // otherwise replace() loops forever against a 403/redirect.
        (function () {
            if (location.pathname !== '/' && location.pathname !== '/index.html') return;
            var lang = 'en';
            try {
                if (localStorage.getItem('language') === 'ar') lang = 'ar';
            } catch (e) { }
            location.replace('/' + lang);
        })();
    </script>
</head>
<body>
    <a href="/en">Future Solutions Dev</a>
</body>
</html>
